<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Rota Facilitada (Spring Boot)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>A Rota Facilitada</h1>
        <p>Sistema inteligente de otimização de rotas (Versão Spring Boot).</p>

        <div class="route-finder">
            <div class="input-group">
                <label for="origin">Origem:</label>
                <input type="text" id="origin" name="origin" placeholder="Ex: Rua A">
            </div>
            <div class="input-group">
                <label for="destination">Destino:</label>
                <input type="text" id="destination" name="destination" placeholder="Ex: Rua F">
            </div>
            <button id="findRouteBtn">Encontrar Melhor Rota</button>
        </div>

        <div class="results">
            <h2>Rota Sugerida:</h2>
            <div id="route-output-container">
                <p id="route-output">Aguardando cálculo da rota...</p>
            </div>
            <!-- Placeholder for future additions like time/congestion if added to API -->
            <!--
            <p><strong>Tempo Estimado:</strong> <span id="time-output">-</span></p>
            <p><strong>Nível de Congestionamento Geral:</strong> <span id="congestion-output">-</span></p>
            -->
        </div>
    </div>

    <script>
        document.getElementById('findRouteBtn').addEventListener('click', function() {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const routeOutput = document.getElementById('route-output');
            const routeOutputContainer = document.getElementById('route-output-container');

            routeOutput.textContent = 'Calculando...';
            routeOutput.className = ''; // Reset class

            if (!origin || !destination) {
                routeOutput.textContent = 'Por favor, preencha os campos de origem e destino.';
                routeOutput.className = 'error-message';
                return;
            }

            // Construct the URL for the API call
            const apiUrl = `/api/route?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        // Try to parse error message if backend sends one, otherwise use generic error
                        return response.json().then(errorData => {
                            throw new Error(Array.isArray(errorData) && errorData.length > 0 ? errorData.join(', ') : `Erro na requisição: ${response.statusText}`);
                        }).catch(() => { // Catch if errorData is not JSON or other parsing error
                            throw new Error(`Erro na requisição: ${response.status} ${response.statusText}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.length > 0) {
                        // Check if the first element suggests an error (as per our controller logic)
                        if (data[0].startsWith("Erro:") || data[0].startsWith("Nenhuma rota encontrada.")) {
                            routeOutput.textContent = data.join(' -> '); // Display the message from backend
                            routeOutput.className = 'error-message';
                        } else {
                            routeOutput.textContent = data.join(' -> ');
                            routeOutput.className = ''; // Clear error class
                        }
                    } else {
                        routeOutput.textContent = 'Nenhuma rota encontrada ou resposta vazia do servidor.';
                         routeOutput.className = 'error-message';
                    }
                })
                .catch(error => {
                    console.error('Erro ao buscar rota:', error);
                    routeOutput.textContent = `Erro ao buscar rota: ${error.message}`;
                    routeOutput.className = 'error-message';
                });
        });
    </script>
</body>
</html>
